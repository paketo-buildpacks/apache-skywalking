api = "0.7"

[buildpack]
  description = "A Cloud Native Buildpack that contributes the Apache SkyWalking Agent and configures it to connect to the service"
  homepage = "https://github.com/paketo-buildpacks/apache-skywalking"
  id = "paketo-buildpacks/apache-skywalking"
  keywords = ["apache-skywalking", "agent", "apm"]
  name = "Paketo Buildpack for Apache SkyWalking"
  sbom-formats = ["application/vnd.syft+json", "application/vnd.cyclonedx+json"]
  version = "{{.version}}"

  [[buildpack.licenses]]
    type = "Apache-2.0"
    uri = "https://github.com/paketo-buildpacks/bellsoft-liberica/blob/main/LICENSE"

[metadata]
  include-files = ["LICENSE", "README.md", "linux/amd64/bin/build", "linux/amd64/bin/detect", "linux/amd64/bin/run", "linux/amd64/bin/helper", "linux/arm64/bin/build", "linux/arm64/bin/detect", "linux/arm64/bin/run", "linux/arm64/bin/helper", "buildpack.toml"]
  pre-package = "scripts/build.sh --target linux/amd64 --target linux/arm64"

  [[metadata.dependencies]]
    checksum = "sha256:b5de2f7e505200030a6a829d62d85c20f81bd703e8c470747a3d776f9fd85f2c"
    cpe = "cpe:2.3:a:apache:skywalking:9.7.0:*:*:*:*:*:*:*"
    id = "skywalking-java"
    name = "Apache SkyWalking Java Agent"
    purl = "pkg:generic/apache-skywalking@9.7.0"
    sha256 = "b5de2f7e505200030a6a829d62d85c20f81bd703e8c470747a3d776f9fd85f2c"
    source = "https://archive.apache.org/dist/skywalking/java-agent/9.7.0/apache-skywalking-java-agent-9.7.0-src.tgz"
    source-checksum = "sha256:839e58e7949c9609011f3caed89aad93efeb8ddbf69c682f6c3fa74d4e043758"
    stacks = ["*"]
    uri = "https://archive.apache.org/dist/skywalking/java-agent/9.7.0/apache-skywalking-java-agent-9.7.0.tgz"
    version = "9.7.0"

    [[metadata.dependencies.licenses]]
      type = "Apache-2.0"
      uri = "https://www.apache.org/licenses/"

  [[metadata.dependencies]]
    checksum = "sha256:ebbc29755302a52580a6c7881d458a371d0d87ca6442d2819a301ef46f25d688"
    cpe = "cpe:2.3:a:apache:skywalking:9.8.0:*:*:*:*:*:*:*"
    id = "skywalking-java"
    name = "Apache SkyWalking Java Agent"
    purl = "pkg:generic/apache-skywalking@9.8.0"
    sha256 = "ebbc29755302a52580a6c7881d458a371d0d87ca6442d2819a301ef46f25d688"
    source = "https://archive.apache.org/dist/skywalking/java-agent/9.8.0/apache-skywalking-java-agent-9.8.0-src.tgz"
    source-checksum = "sha256:adb8e63359ed1bf00603984f8e60c99f3d8b75d27b38da69b6716a89d8ae8c40"
    stacks = ["*"]
    uri = "https://archive.apache.org/dist/skywalking/java-agent/9.8.0/apache-skywalking-java-agent-9.8.0.tgz"
    version = "9.8.0"

    [[metadata.dependencies.licenses]]
      type = "Apache-2.0"
      uri = "https://www.apache.org/licenses/"

  [[metadata.dependency-constraints]]
    constraint = "9.*"
    id = "skywalking-java"
    patches = 2

[[stacks]]
  id = "*"

[[targets]]
  arch = "amd64"
  os = "linux"

[[targets]]
  arch = "arm64"
  os = "linux"
